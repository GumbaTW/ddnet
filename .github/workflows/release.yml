name: Release

on:
  push:
    tags:
      - "gclient-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            # Keep bundled static libs (FFmpeg and friends). SDL2 and FreeType
            # have no usable Linux bundle, and the bundled libcurl.so is a stub.
            cmake-args: -G Ninja -DPREFER_BUNDLED_LIBS=ON -DIPO=ON
            package-glob: "*-linux_*.tar.xz"
          - name: windows
            os: windows-latest
            cmake-args: -A x64 -DEXCEPTION_HANDLING=ON -DVULKAN=ON
            package-glob: "*-win64.zip"
          - name: macos
            os: macos-latest
            cmake-args: -G Ninja -DPREFER_BUNDLED_LIBS=ON -DIPO=ON
            package-glob: "*-macos.dmg"

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Prepare Linux
      if: matrix.name == 'linux'
      run: |
        sudo apt-get update -y
        packages=(
          # tidy-alphabetical-start
          cmake
          libasound2-dev
          libcurl4-openssl-dev
          libfreetype6-dev
          libgl1-mesa-dev
          libsdl2-dev
          libvulkan-dev
          libx11-dev
          libxcursor-dev
          libxi-dev
          libxinerama-dev
          libxrandr-dev
          libxss-dev
          ninja-build
          pkg-config
          python3
          zlib1g-dev
          # tidy-alphabetical-end
        )
        sudo apt-get install -y "${packages[@]}"

    - name: Prepare macOS
      if: matrix.name == 'macos'
      run: |
        brew update
        brew install ffmpeg molten-vk ninja pkg-config sdl2
        brew upgrade freetype
        pip3 install --break-system-packages dmgbuild pyobjc-framework-Quartz
        echo /Library/Frameworks/Python.framework/Versions/3.12/bin >> $GITHUB_PATH
        sudo rm -rf /Library/Developer/CommandLineTools

    - name: Install Vulkan SDK
      if: matrix.name != 'macos'
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
        cache-bin: false # WORKAROUND(https://github.com/Swatinem/rust-cache/issues/341)
        workspaces: |
          ./

    - name: Package
      shell: bash
      run: |
        if [ "${{ matrix.name }}" = "linux" ]; then
          rm -f ddnet-libs/curl/linux/lib64/libcurl.so
        fi
        mkdir release
        cd release
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -DINFORM_UPDATE=OFF -DAUTOUPDATE=OFF -DDOWNLOAD_GTEST=OFF -DSERVER=OFF -DTOOLS=OFF -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target package_default
        mkdir artifacts
        mv ${{ matrix.package-glob }} artifacts

    - name: Rename package
      shell: bash
      run: |
        cd release/artifacts
        if [ "${{ github.ref_type }}" = "tag" ]; then
          version="${GITHUB_REF_NAME#gclient-}"
        else
          version="dev-${GITHUB_SHA::7}"
        fi
        shopt -s nullglob
        for file in *; do
          case "$file" in
            *-linux_*.tar.xz)
              suffix="${file#*-linux_}"
              mv "$file" "GClient-${version}-linux_${suffix}"
              ;;
            *-win64.zip)
              mv "$file" "GClient-${version}-win64.zip"
              ;;
            *-macos.dmg)
              mv "$file" "GClient-${version}-macos.dmg"
              ;;
          esac
        done
        ls -l

    - name: Upload package
      uses: actions/upload-artifact@v6
      with:
        name: gclient-${{ matrix.name }}
        path: release/artifacts/*
        if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/gclient-')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v6
      with:
        path: dist
        merge-multiple: true

    - name: Release version
      id: version
      run: echo "version=${GITHUB_REF_NAME#gclient-}" >> "$GITHUB_OUTPUT"

    - name: Publish
      uses: softprops/action-gh-release@v2
      with:
        name: GClient ${{ steps.version.outputs.version }}
        files: dist/*
        body: |
          Unofficial DDNet client.

          The executable is still named DDNet and uses your existing DDNet settings. This build does not update itself and does not link to the official DDNet download.

          Windows SmartScreen and macOS Gatekeeper warn because these builds are unsigned. On macOS, right-click the app and choose Open. The Linux build needs glibc from Ubuntu 22.04 or newer, plus SDL2, FreeType, and libcurl (`libsdl2-2.0-0`, `libfreetype6`, and `libcurl4` on Ubuntu).
